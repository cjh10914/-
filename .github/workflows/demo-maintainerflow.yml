name: Demo MaintainerFlow

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  maintainerflow-demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MaintainerFlow
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Prepare issue payload
        if: github.event_name == 'issues'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = {
              "title": "${{ github.event.issue.title }}",
              "body": "${{ github.event.issue.body }}",
          }
          Path("issue.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

      - name: Triage issue
        if: github.event_name == 'issues'
        run: maintainerflow triage-issue issue.json --output json --out-file triage-output.json

      - name: Summarize PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --prune --depth=2 origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          maintainerflow review-pr pr.diff --output json --out-file pr-review-output.json

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: maintainerflow-output-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            triage-output.json
            pr-review-output.json

      - name: Comment on PR with summary (demo)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = JSON.parse(fs.readFileSync('pr-review-output.json', 'utf8'));
            const body = `### MaintainerFlow PR Summary (assistive)\n- Risk: **${out.risk_level}**\n- ${out.summary}\n\n> This output is heuristic and must be validated by human maintainers.`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
