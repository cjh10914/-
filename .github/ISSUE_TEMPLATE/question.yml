name: Question
description: Ask for help using MaintainerFlow.
title: "question: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include command, input shape, and current output.
    validations:
      required: false
